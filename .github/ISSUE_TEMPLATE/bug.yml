name: Something is not working
description: The app crashed, will not open, looks broken or behaves oddly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Which version?
      description: It is in the name of the file you downloaded, for example 0.2.2.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Installer or portable?
      options: [Installer, Portable zip, Built from source]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The page you were on and the steps that lead to it help most. A screenshot is welcome.
    validations:
      required: true
