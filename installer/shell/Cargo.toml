[package]
name = "gta6-hq-setup"
version = "0.1.0"
edition = "2021"
description = "GTA 6 HQ Setup - the custom installer window. It shows the app's own look and runs the Inno Setup installer it carries, silently."
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[workspace]
